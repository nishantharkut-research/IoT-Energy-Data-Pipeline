name: coursework-ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev,dataset]'
      - run: ruff check src jobs dashboard tests scripts
      - run: ruff format --check src jobs dashboard tests scripts
      - run: python -m scripts.scan_independence
      - run: python -m pytest tests/unit tests/property tests/contract -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci
        working-directory: dashboard/web
      - run: npm run check
        working-directory: dashboard/web
      - run: python -m pip install 'playwright>=1.45.0,<2.0.0'
      - run: python -m playwright install chromium --with-deps
      - run: python -m scripts.check_dashboard_layout --serve dashboard/web/dist --output tmp/layout-checks.json
